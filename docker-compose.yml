services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: open_rm_user
      POSTGRES_DB: open_rm
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_rm_user -d open_rm"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # DATABASE_URL must be provided in .env, e.g.:
    #   DATABASE_URL=postgresql://open_rm_user:PASSWORD@db:5432/open_rm
    env_file:
      - .env
    ports:
      - "8000:8000"

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  pgdata:
