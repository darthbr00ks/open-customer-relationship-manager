services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: open_rm_user
      POSTGRES_DB: open_rm
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_rm_user -d open_rm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # DATABASE_URL and REDIS_URL must be provided in .env, e.g.:
    #   DATABASE_URL=postgresql://open_rm_user:PASSWORD@db:5432/open_rm
    #   REDIS_URL=redis://redis:6379
    env_file:
      - .env
    ports:
      - "3000:3000"

  # Same image, different entrypoint: imports and reports run here, not in a request.
  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    command: ["npm", "run", "worker"]

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  pgdata:
  redisdata:
